<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>НейроАссистент</title>
<style>
:root{--bg:#0f1b33;--card:#16264a;--ink:#e8eefc;--mut:#8fa3c8;--acc:#37d0c0;--hl:#ffd166;--l:#6aa7ff;--r:#ff8fab;--f:#9be564}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:#0b1428;border-bottom:1px solid #243a68}
header b{font-size:18px}header span{color:var(--mut);font-size:13px}
.wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;padding:12px}
.card{background:var(--card);border-radius:12px;padding:12px;border:1px solid #243a68}
h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
#text{min-height:64px;font-size:26px;padding:8px 12px;background:#0b1428;border-radius:8px;white-space:pre-wrap;border:1px solid #243a68}
.cur{display:inline-block;width:2px;height:26px;background:var(--acc);vertical-align:-4px;animation:b 1s infinite}@keyframes b{50%{opacity:0}}
.row{display:flex;gap:6px;margin-top:6px;padding:4px;border-radius:8px;border:2px solid transparent}
.row.on{border-color:var(--hl);background:#1d3160}
.k{flex:1;text-align:center;padding:10px 4px;background:#223a6e;border-radius:8px;font-size:20px;min-width:34px}
.k.sug{font-size:17px;color:var(--acc)}.k.sel{background:var(--hl);color:#10203f;font-weight:700}
.bars .b{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.bars .n{width:92px;color:var(--mut)}
.bars .t{flex:1;background:#0b1428;height:14px;border-radius:7px;overflow:hidden}.bars .f{height:100%;background:var(--acc);width:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}button{background:#223a6e;color:var(--ink);border:1px solid #35528f;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
button:hover{background:#2c4a8c}button.p{background:var(--acc);color:#052b27;border:0;font-weight:700}
canvas{width:100%;height:210px;background:#0b1428;border-radius:8px;display:block}
.q{display:flex;gap:10px;font-size:13px;color:var(--mut);margin-top:6px;flex-wrap:wrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.cmd{font-size:22px;font-weight:700;color:var(--acc);min-height:30px}.small{font-size:12px;color:var(--mut)}
.leg{display:flex;gap:14px;margin-top:4px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.k{font-size:17px;min-width:24px}header{align-items:flex-start;gap:12px}}
</style></head><body>
<header><b>🧠 НейроАссистент</b><span id="mode">режим: симуляция гарнитуры (без датчиков)</span></header>
<div class="wrap"><div>
 <div class="card"><h3>Набранный текст</h3><div id="text"></div></div>
 <div class="card" style="margin-top:12px"><h3>Экранная клавиатура со сканированием <span id="lvl" class="small"></span></h3><div id="kb"></div>
  <div class="small" style="margin-top:8px">Левая рука — назад/вверх · Правая рука — вперёд/вниз · Ноги — выбрать</div></div>
</div><div>
 <div class="card"><h3>Сигнал ЭЭГ (мкВ), последние 4 с</h3><canvas id="cv" width="640" height="210"></canvas>
  <div class="q" id="q"></div></div>
 <div class="card" style="margin-top:12px"><h3>Распознанное намерение</h3><div class="cmd" id="cmd">—</div>
  <div class="bars" id="bars"></div><div class="small" id="info"></div>
  <div class="btns"><button class="p" onclick="f('/demo')">▶ Демо: набрать «привет»</button><button onclick="f('/reset')">⟲ Сброс</button>
  <button onmousedown="f('/intent/0')" onmouseup="f('/intent/3')">← левая рука</button><button onmousedown="f('/intent/1')" onmouseup="f('/intent/3')">правая рука →</button><button onmousedown="f('/intent/2')" onmouseup="f('/intent/3')">↓ ноги</button></div></div>
</div></div>
<script>
const f=u=>fetch(u);const C=['#6aa7ff','#ffd166','#ff8fab'];
async function tick(){try{const s=await (await fetch('/state')).json();draw(s)}catch(e){}setTimeout(tick,250)}
function draw(s){
 if(s.replay){
 document.getElementById('mode').textContent='PhysioNet S001 · отложенные записи R12/R14 · офлайн';
 document.querySelector('.p').textContent='▶ Воспроизвести 53 эпохи';
 document.querySelectorAll('[onmousedown]').forEach(b=>b.hidden=true);
 }

 const kb=s.kb;document.getElementById('text').innerHTML=kb.text.replace(/\n/g,'↵\n')+'<span class="cur"></span>';
 document.getElementById('lvl').textContent=kb.level=='row'?'— выбор строки':'— выбор символа';
 let h='';kb.rows.forEach((r,i)=>{const cells=(i==kb.row&&kb.level=='col')?['↩',...r]:r;
  h+=`<div class="row ${i==kb.row?'on':''}">`+cells.map((c,j)=>{const sel=(i==kb.row&&kb.level=='col'&&j==kb.col);return `<div class="k ${i==0?'sug':''} ${sel?'sel':''}">${c||'·'}</div>`}).join('')+'</div>'});
 document.getElementById('kb').innerHTML=h;
 document.getElementById('cmd').textContent=(s.last_cmd&&s.cmd_age<3)?'➜ '+s.last_cmd:(s.intent=='покой'?'покой':'…');
 document.getElementById('bars').innerHTML=s.classes.map((n,i)=>`<div class="b"><span class="n">${n}</span><div class="t"><div class="f" style="width:${(s.probs[i]*100).toFixed(0)}%"></div></div><span>${(s.probs[i]*100).toFixed(0)}%</span></div>`).join('');
 document.getElementById('info').textContent=`точность калибровки (перекрёстная проверка): ${(s.cv*100).toFixed(0)}% · команд: ${s.sent} · время ${s.t} с`+(s.demo?' · идёт демонстрация':'');
 document.getElementById('q').innerHTML=s.channels.map((c,i)=>`<span><i class="dot" style="background:${C[i]}"></i>${c} ${s.quality[i]>0.7?'✓ контакт хороший':'⚠ проверьте контакт'}</span>`).join('');
 if(s.replay){
 document.getElementById('info').textContent=`Эпоха ${s.epoch}/${s.total} · метка: ${s.truth} · прогноз: ${s.prediction} · совпадений ${(s.cv*100).toFixed(1)}%. Команды поданы в экранную клавиатуру. Это офлайн-проверка, целевая фраза не задавалась.`;
 document.getElementById('q').textContent='C3 · Cz · C4, 160 Гц. Показана обработанная эпоха 1,5 с; контакт с человеком не измеряется.';
 }
 const cv=document.getElementById('cv'),g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);
 s.eeg.forEach((ch,i)=>{g.strokeStyle=C[i];g.lineWidth=1.3;g.beginPath();const y0=40+i*65;ch.forEach((v,k)=>{const x=k/(ch.length-1)*cv.width,y=y0-v*0.9;k?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#8fa3c8';g.font='12px Arial';g.fillText(s.channels[i],4,y0-24)});
}
tick();
</script></body></html>
